name: Bug report
description: Report a reproducible problem using sanitized information.
body:
  - type: markdown
    attributes:
      value: "Remove research targets, sequences, unpublished results, credentials, usernames, hosts, and private paths before posting. Use P12345/Q12345 as placeholders."
  - type: input
    id: version
    attributes:
      label: AF3 Console version
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python/Qt, Slurm and container runtime versions; no private hostnames.
  - type: textarea
    id: reproduce
    attributes:
      label: Steps and expected behavior
      description: Use synthetic inputs and replace paths with /path/to/your/...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized error output
      render: text
