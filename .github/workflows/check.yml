name: Deployment checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONIOENCODING: utf-8
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - name: Obtain the exact matching source and tests
        uses: actions/checkout@v4
        with:
          ref: b89cb13f1edc4f85bf93a065ccd39af0774bed14
          path: .source-check
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0
          python -m pip install -r .source-check/requirements-dev.txt
      - name: Verify the deployable files and start the isolated GUI
        run: python -B .github/check_runtime.py --source .source-check
      - name: Run the full matching source test suite
        working-directory: .source-check
        run: python -B -m unittest discover -s tests -v
