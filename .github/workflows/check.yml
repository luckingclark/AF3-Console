name: Offline checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONIOENCODING: utf-8
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Qt system library and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0
          python -m pip install -r requirements-dev.txt
      - name: Check checked-in GUI payload and workflow graphics
        run: |
          python -B packaging/audit_release.py
          python -B packaging/build_workflow_diagram.py --check
      - name: Offline tests
        run: python -B -m unittest discover -s tests -v
      - name: Build clean source and runtime archives
        run: python -B packaging/build_release.py
